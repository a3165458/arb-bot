[package]
name = "arb-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "arb-web"
path = "src/main.rs"

[dependencies]
arb-core = { workspace = true }
arb-scanner = { workspace = true }
arb-venues = { workspace = true }
arb-exec = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
# 响应压缩：/api/scan 一次 13 MB、app.js 120 KB，不压缩的话远程访问很慢。
# 价差监控的行情 WebSocket（Lighter RH / Arcus）。只用 rustls + ring，与 reqwest 同一套 TLS。
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { workspace = true, features = ["sink", "std"] }
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip", "set-header"] }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
